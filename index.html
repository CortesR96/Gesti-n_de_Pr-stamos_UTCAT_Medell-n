  </div>
 </div>
</div>

function cambiarEstadoReq(id, nuevoEst){
 const r = DB.reqs.find(x=>x.id===id);
 if(!r || r.estado===nuevoEst) return;
 const antEst = r.estado;
 const obsEl = $('#obsCoordTxt');
 const obs = obsEl ? obsEl.value : '';
 r.obsCoord = obs;

 if((nuevoEst==='En préstamo' || nuevoEst==='Aprobada') && antEst==='Pendiente'){
  r.items.forEach(it=>{
   const m = DB.inv.find(x=>x.nom===it.nom);
   if(m){ m.disp = Math.max(0, m.disp - it.cant); m.prest += it.cant; }
  });
 } else if((nuevoEst==='Devuelta' || nuevoEst==='Rechazada') && (antEst==='En préstamo' || antEst==='Aprobada')){
  r.items.forEach(it=>{
   const m = DB.inv.find(x=>x.nom===it.nom);
   if(m){ m.disp = Math.min(m.tot, m.disp + it.cant); m.prest = Math.max(0, m.prest - it.cant); }
  });
 }

 r.estado = nuevoEst;
 const fechaHoy = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
 r.hist.push([`Estado: ${nuevoEst}${obs?' ('+obs+')':''}`, `${fechaHoy} · Coordinación`]);
 saveDB();
 render();
 notify(`Solicitud ${id} actualizada a: ${nuevoEst}`);
}

function saveInvItem(){
 const nom = $('#mNom').value.trim();
 if(!nom) return notify('Ingresa el nombre del elemento');
 const tot = Math.max(1, parseInt($('#mTot').value)||1);
 const disp = Math.min(tot, Math.max(0, parseInt($('#mDisp').value)||0));
 const data = { nom, cat:$('#mCat').value, ic:$('#mIcon').value\vert{}\vert{}'📦', tot, disp, prest:tot-disp, est:$('#mEst').value };
 if(editId){
  const idx = DB.inv.findIndex(x=>x.id===editId);
  DB.inv[idx] = Object.assign({}, DB.inv[idx], data);
  notify('Elemento actualizado');
 } else {
  DB.inv.push(Object.assign({id:Date.now()}, data));
  notify('Elemento agregado al inventario');
 }
 saveDB(); closeModal(); render();
}

 window.addEventListener('load', ()=>{
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
 });

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
 e.preventDefault();
 deferredPrompt = e;
 $('#installBtn').style.display = 'inline-block';
});

async function installPWA(){
 if(!deferredPrompt) return;
 deferredPrompt.prompt();
 const { outcome } = await deferredPrompt.userChoice;
 if(outcome === 'accepted') $('#installBtn').style.display = 'none';
 deferredPrompt = null;
}
</script>
